name: Phase 1 secure demo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [harden-demo-publication, document-ingestion-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    name: Publication and Streamlit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "."
      DEPLOY_MODE: "true"
      PYTHON_DOTENV_DISABLED: "1"
      OPENAI_API_KEY: "synthetic-no-network-key"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all unit and synthetic integration tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check for whitespace errors
        run: git diff --check

  browser:
    name: Synthetic graph browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "."
      DEPLOY_MODE: "true"
      PYTHON_DOTENV_DISABLED: "1"
      OPENAI_API_KEY: "synthetic-no-network-key"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Find isolated Playwright Chromium executable
        run: |
          echo "SECONDSELF_TEST_CHROME=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Run synthetic document browser checks
        run: PYTHONPATH=.:tests python -B tests/browser_document_check.py
      - name: Run synthetic graph browser checks
        run: python -B tests/browser_demo_check.py
